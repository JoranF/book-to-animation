# ACE-Step 1.5: open music model (MIT) that makes the background music of the
# Shorts on our own NVIDIA GPU. Deploy as a Dokploy "Compose" app with this file
# (compose path: musicgen/docker-compose.yml). No domain: only the
# book-to-animation app talks to it, over dokploy-network.
#
# Env vars to set in Dokploy (Environment tab of this compose app):
#   ACESTEP_API_KEY   a long random string; put the same value in the
#                     book-to-animation app as ACESTEP_API_KEY
# Then in the book-to-animation app:
#   ACESTEP_URL=http://b2a-acestep:8001
#
# The host needs the NVIDIA driver and the NVIDIA Container Toolkit
# (check with: nvidia-smi, and docker run --rm --gpus all ubuntu nvidia-smi).
# First start downloads the model weights (~10 GB) into the checkpoints volume.

services:
  acestep:
    build:
      # official repo, pinned to a release so a rebuild never changes behaviour
      context: https://github.com/ace-step/ACE-Step-1.5.git#v0.1.8
      dockerfile: Dockerfile
    container_name: b2a-acestep
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - ACESTEP_MODE=api
      - ACESTEP_API_HOST=0.0.0.0
      - ACESTEP_API_PORT=8001
      - ACESTEP_API_KEY=${ACESTEP_API_KEY:?set ACESTEP_API_KEY in Dokploy}
      # turbo model (8 steps). We send every setting ourselves, so the
      # language model is only loaded if ACE-Step really needs it (0.6B = small).
      - ACESTEP_CONFIG_PATH=acestep-v15-turbo
      - ACESTEP_LM_MODEL_PATH=acestep-5Hz-lm-0.6B
      - ACESTEP_LM_BACKEND=pt
      - TOKENIZERS_PARALLELISM=false
    volumes:
      - acestep-checkpoints:/app/checkpoints
      - acestep-hf-cache:/root/.cache/huggingface
      - acestep-output:/app/output
    shm_size: "2gb"
    networks:
      - dokploy-network
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8001/health > /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 600s
      retries: 5

volumes:
  acestep-checkpoints:
  acestep-hf-cache:
  acestep-output:

networks:
  dokploy-network:
    external: true
